!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeZone - Online Chat</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#ff5e8a,#a855f7,#ff8a5c);min-height:100vh;padding:15px;box-sizing:border-box}
h1{color:white;text-align:center}
.box{background:white;border-radius:20px;padding:15px;max-width:500px;margin:auto}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px;box-sizing:border-box}
#chat{background:#111;color:white;height:300px;border-radius:15px;padding:12px;overflow:auto;margin-bottom:10px}
.row{display:flex;gap:10px}
.row input{margin:0}
button{background:#ff2d55;color:white;border:0;padding:12px 20px;border-radius:10px;font-weight:bold}
</style>
</head>
<body>
<h1>🔥 VibeZone - Online Chat</h1>
<div class="box">
<input placeholder="Your name e.g Ayangba">
<div id="chat"></div>
<div class="row">
<input id="msg" placeholder="Type message...">
<button onclick="send()">Send</button>
</div>
</div>
<script>
function send(){
var m=document.getElementById('msg').value;
if(!m) return;
var c=document.getElementById('chat');
c.innerHTML+='<div>'+m+'</div>';
document.getElementById('msg').value='';
}
</script>
</body>
</html>
