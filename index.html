<!DOCTYPE html>
<html>
<head>
<title>VibeZone - Naija First</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#111;color:white;text-align:center;margin:0;padding:20px}
h1{font-size:40px}
.card{background:white;color:black;border-radius:15px;padding:15px;margin:15px 0;text-align:left}
button{background:#ff0066;color:white;border:none;padding:12px 18px;border-radius:20px;font-size:16px;margin:5px}
input{width:80%;padding:12px;border-radius:20px;border:none;margin:10px}
</style>
</head>
<body>
<h1>🔥 VibeZone</h1>
<p>Welcome to Naija First Social App 🇳🇬</p>
<div class="card">
<h2>What's your vibe today?</h2>
<button onclick="postVibe('😎 Chill')">😎 Chill</button>
<button onclick="postVibe('🎉 Party')">🎉 Party</button>
<button onclick="postVibe('❤️ Love')">❤️ Love</button>
<button onclick="voiceNote()">🎤 Voice Note</button>
</div>
<div class="card">
<h2>📱 Status Feed</h2>
<div id="feed"><p><b>@LagosBoy:</b> Lagos no dey sleep! 🔥</p></div>
</div>
<div class="card">
<h2>💬 Chat</h2>
<div id="chatBox"><p><b>You:</b> Hello VibeZone!</p></div>
<input id="chatInput" placeholder="Type message...">
<br>
<button onclick="sendChat()">Send</button>
</div>
<p>Made with ❤️ in Lagos</p>
<script>
function postVibe(v){document.getElementById('feed').innerHTML += "<p><b>You:</b> "+v+"</p>";}
function voiceNote(){alert("🎤 Voice Vibe recording... (Demo)");document.getElementById('feed').innerHTML += "<p><b>You:</b> 🎤 Voice Note sent!</p>";}
function sendChat(){let m=document.getElementById('chatInput').value;if(m=="") return;document.getElementById('chatBox').innerHTML += "<p><b>You:</b> "+m+"</p>";document.getElementById('chatInput').value="";}
</script>
</body>
</html>
