!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeZone - Live Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#111;color:#fff;margin:0;padding:10px}
#chat{height:60vh;overflow-y:auto;background:#222;padding:10px;border-radius:10px}
.msg{background:#333;padding:8px;margin:5px 0;border-radius:8px}
input{width:70%;padding:10px;border-radius:8px;border:none}
button{padding:10px 15px;background:#ff2d55;color:#fff;border:none;border-radius:8px}
</style>
</head>
<body>
<h2>🔥 VibeZone - Online Chat</h2>
<input id="username" placeholder="Your name e.g Ayangba" /><br><br>
<div id="chat"></div><br>
<input id="msgInput" placeholder="Type message..." />
<button onclick="sendMsg()">Send</button>

<script>
const SUPABASE_URL = "https://qwlqitglihyvrkvedajv.supabase.co";
const SUPABASE_KEY = "sb_publishable_UwgtUP4-gciUdkiEP0Qccw_zfXIOwZ4";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadMessages(){
  const { data } = await supabaseClient.from('messages').select('*').order('created_at',{ascending:true});
  const chat = document.getElementById('chat');
  chat.innerHTML = "";
  if(data) data.forEach(m=>{
    chat.innerHTML += `<div class="msg"><b>${m.username}:</b> ${m.message}</div>`;
  });
  chat.scrollTop = chat.scrollHeight;
}

async function sendMsg(){
  const username = document.getElementById('username').value || "Guest";
  const message = document.getElementById('msgInput').value;
  if(!message) return;
  await supabaseClient.from('messages').insert([{username, message}]);
  document.getElementById('msgInput').value = "";
}

loadMessages();

// Real-time - when friend sends, you see am instantly
supabaseClient.channel('chat-room')
  .on('postgres_changes', {event:'INSERT', schema:'public', table:'messages'}, ()=> loadMessages())
  .subscribe();
</script>
</body>
</html>
